name: CI/CD Pipeline - Build & Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # ========================================================
  # STAGE 1: CI (Continuous Integration - Validate & Build)
  # ========================================================
  validate-and-build:
    name: Build & Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ========================================================
  # STAGE 2: CD (Continuous Deployment - Deploy to VPS via SSH)
  # ========================================================
  deploy-to-vps:
    name: Deploy to Server via SSH
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect and Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE || '' }}
          envs: GITHUB_TOKEN,GITHUB_REPOSITORY
          script_stop: true
          script: |
            echo "=================================================="
            echo "🚀 Starting Automated Deployment for $GITHUB_REPOSITORY"
            echo "=================================================="
            
            APP_DIR="${{ secrets.SERVER_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/var/www/artiset-website"
            fi

            echo "📁 Target directory: $APP_DIR"
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Authenticate Git with GITHUB_TOKEN for private or public repos
            REPO_AUTH_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            if [ ! -d ".git" ]; then
              echo "📦 Cloning repository..."
              git clone "$REPO_AUTH_URL" .
            else
              echo "🔄 Updating existing repository..."
              git remote set-url origin "$REPO_AUTH_URL"
              git fetch origin main
              git reset --hard origin/main
            fi

            echo "📦 Installing dependencies..."
            npm ci --legacy-peer-deps || npm install

            echo "🏗️ Building Next.js application..."
            npm run build

            echo "♻️ Reloading PM2 process..."
            if command -v pm2 > /dev/null 2>&1; then
              if [ -f "ecosystem.config.js" ]; then
                pm2 startOrReload ecosystem.config.js --update-env
              else
                pm2 reload artiset-website || pm2 start npm --name "artiset-website" -- start
              fi
              pm2 save
            else
              echo "⚠️ PM2 not detected. Installing globally..."
              sudo npm install -g pm2 || npm install -g pm2
              pm2 start ecosystem.config.js
              pm2 save
            fi

            echo "=================================================="
            echo "✅ Deployment completed successfully!"
            echo "=================================================="
