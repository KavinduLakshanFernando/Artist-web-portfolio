name: Build and Deploy to CapRover

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.CAPROVER_SERVER }}" ]; then MISSING="$MISSING CAPROVER_SERVER"; fi
          if [ -z "${{ secrets.CAPROVER_APP }}" ]; then MISSING="$MISSING CAPROVER_APP"; fi
          if [ -z "${{ secrets.CAPROVER_APP_TOKEN }}" ]; then MISSING="$MISSING CAPROVER_APP_TOKEN"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository secret(s):$MISSING"
            echo "Ensure CAPROVER_SERVER, CAPROVER_APP, and CAPROVER_APP_TOKEN are set in GitHub Secrets."
            exit 1
          fi

      - name: Prepare Image Metadata
        id: meta
        run: |
          # GHCR requires image names to be lowercase
          LOWER_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_URI="ghcr.io/${LOWER_REPO}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"
          echo "image_tag_sha=${IMAGE_URI}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "image_tag_latest=${IMAGE_URI}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_tag_sha }}
            ${{ steps.meta.outputs.image_tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Image to CapRover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: ${{ secrets.CAPROVER_SERVER }}
          app: ${{ secrets.CAPROVER_APP }}
          token: ${{ secrets.CAPROVER_APP_TOKEN }}
          image: ${{ steps.meta.outputs.image_tag_sha }}
